# 1. INFORMACIÓN BÁSICA
site_name: Platform Architect's Cookbook
site_description: Centralized SRE & Data Engineering Standards
site_author: Marco Tulio Catalán Funes
site_url: https://idp-gt.github.io/platform-architect/
repo_url: https://github.com/idp-gt/platform-architect
repo_name: platform-architect

# 2. TEMA (APARIENCIA)
theme:
  name: material
  language: en
  logo: assets/logo-final.png
  # Logo e Ícono (puedes usar emojis o rutas a imágenes)
  icon:
    repo: fontawesome/brands/github
  favicon: assets/logoblanco.png
  # Características de la interfaz (estilo Google Cloud Docs)
  features:
    - navigation.tabs        # Pestañas superiores en lugar de menú lateral
    - navigation.sections    # Agrupa secciones en el menú
    - navigation.top         # Botón "Volver arriba"
    - search.suggest         # Sugerencias mientras escribes en la búsqueda
    - search.highlight       # Resalta lo que buscas
    - content.code.copy      # Botón de copiar en bloques de código
    - toc.follow

  # Paleta de Colores (Modo Claro y Oscuro)
  palette: 
    # Modo Claro (Por defecto)
    - scheme: default
      primary: white          # Color principal (Barra superior)
      accent: blue         # Color de enlaces y botones
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Modo Oscuro (Opcional para el usuario)
    - scheme: slate
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono
# 3. PLUGINS (FUNCIONALIDADES EXTRA)
plugins:
  - search                 # Barra de búsqueda (Obligatorio)
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: es
          default: true
          name: Español
          build: true
        - locale: en
          name: English
          build: true
  - blog:                  # Tu Blog Técnico
      blog_dir: blog
      post_url_date_format: yyyy/MM/dd

# 4. EXTENSIONES DE MARKDOWN (PARA QUE SE VEA PRO)
markdown_extensions:
  - admonition             # Para notas de advertencia/info (cajas de colores)
  - attr_list              # Para listas con atributos personalizados
  - md_in_html             # REQUIRED for grid cards
  - pymdownx.details       # Para secciones colapsables
  - pymdownx.superfences   # Para diagramas y código avanzado
  - toc:
      permalink: true        # Pone un símbolo ¶ al lado de cada título para copiar el link
      toc_depth: 3
  - pymdownx.tabbed:       # Pestañas dentro del contenido
      alternate_style: true
  - pymdownx.highlight:    # Resaltado de sintaxis de código
      anchor_linenums: true
  - pymdownx.emoji:        # Emojis :rocket:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# 5. NAVEGACIÓN (TU MENÚ)
# Aquí mapeas el título del menú -> archivo en la carpeta docs/
nav:
  - Home: index.md
  
  - 'Base Layer (Core Infrastructure)':
      - '1. Provisioning & Bootstrapping': modules/base/1-provisioning.md
      - '2. GitOps & Continuous Delivery': modules/sre/gitops.md
      - '3. Advanced Networking': modules/sre/networking.md
      - '4. Observability Stack': modules/sre/observability.md
      - '5. Security & Policy Enforcement': modules/sre/security.md
      - '6. FinOps & Resource Optimization': modules/sre/findops.md
  
  - 'Data Layer (Data Platforms & Pipelines)':
      - '1. Data Infrastructure': modules/data/iac.md
      - '2. Data Observability': modules/data/observability.md
      - '3. Security & Governance': modules/data/automation.md
  
  - 'AI Layer (AI & MLOps)':
      - '1. AI Infrastructure': modules/ia/components.md
      - '2. RAG': modules/ia/rag.md  
      - '3. MCP': modules/ia/mcp.md
      - '4. Sub Agents': modules/ia/sub-agents.md
      - '5. A2A': modules/ia/a2a.md
      
  - 'Personal Blog':
      - blog/index.md  # El índice del blog se genera solo

  - 'About':
      - 'My Profile': about.md
# HOJAS DE ESTILO EXTRA
extra_css:
  - stylesheets/extra.css

extra:
  alternate:
    - name: Español
      link: /platform-architect/
      lang: es
    - name: English
      link: /platform-architect/en/
      lang: en
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/macogt/
      name: Marco Catalán on LinkedIn
    
    - icon: fontawesome/brands/github
      link: https://github.com/mcatalangt
      name: My GitHub Profile